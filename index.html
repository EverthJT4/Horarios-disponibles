<!doctype html>
<html lang="es">
<head>
<title>Horas libres</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
/* Layout: one column; header with week switcher, a week grid with two time rails (Caracas / Nueva York), then a plain summary list. */
:root {
  --bg: #f5f7f6;
  --surface: #ffffff;
  --ink: #18221f;
  --muted: #5d6b67;
  --line: #dde4e1;
  --line-soft: #ecf0ee;
  --free: #1f9d74;
  --free-soft: #d4f1e6;
  --free-ink: #0d5b41;
  --accent: #2c4bd1;
  --warn: #9a5b00;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --ink: #e6eeeb; --muted: #97a6a1;
    --line: #2a3531; --line-soft: #202a26; --free: #36c497; --free-soft: #17402f;
    --free-ink: #a6f0d3; --accent: #8aa2ff; --warn: #f0b45c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --ink: #e6eeeb; --muted: #97a6a1;
  --line: #2a3531; --line-soft: #202a26; --free: #36c497; --free-soft: #17402f;
  --free-ink: #a6f0d3; --accent: #8aa2ff; --warn: #f0b45c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
h1 { margin: 0; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); max-width: 60ch; line-height: 1.5; }
.weeknav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weeknav .label { font-weight: 700; min-width: 13ch; text-align: center; font-variant-numeric: tabular-nums; }
button {
  font: inherit; font-weight: 600; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar .left { display: flex; gap: 8px; flex-wrap: wrap; }
button.primary { background: var(--free); border-color: var(--free); color: #fff; }
#linkBox { width: 100%; font: inherit; font-family: var(--font-mono); font-size: .8rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.status { color: var(--muted); font-size: .85rem; }
.status.warn { color: var(--warn); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .85rem; align-items: center; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; background: var(--free); }
.gridbox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.grid {
  display: grid; grid-template-columns: 58px 58px repeat(7, minmax(62px, 1fr));
  min-width: 600px; user-select: none; -webkit-user-select: none;
}
.hcell {
  position: sticky; top: 0; z-index: 2; background: var(--surface);
  border-bottom: 1px solid var(--line); padding: 8px 4px; text-align: center; font-size: .8rem;
}
.hcell .d { font-weight: 700; font-size: .9rem; }
.hcell .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.hcell.today .d { color: var(--accent); }
.tz { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; line-height: 1.2; }
.time {
  font-family: var(--font-mono); font-size: .72rem; color: var(--muted); text-align: right;
  padding: 0 6px; height: 30px; line-height: 30px; border-right: 1px solid var(--line-soft);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.time.half { color: transparent; }
.time.et { color: var(--accent); opacity: .85; }
.time.et.half { color: transparent; }
.slot { height: 30px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); cursor: pointer; }
.slot.hour { border-bottom: 1px solid var(--line-soft); }
.slot:hover { background: var(--line-soft); }
.slot.on { background: var(--free); border-bottom-color: var(--free); }
.slot.on.end { border-bottom-color: var(--line-soft); }
.slot.ro { cursor: default; }
.slot.ro:hover { background: transparent; }
.slot.on.ro:hover { background: var(--free); }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.summary h2 { margin: 0 0 12px; font-size: 1rem; }
.summary ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.summary li { display: grid; grid-template-columns: 9ch 1fr; gap: 12px; align-items: baseline; }
.summary .day { font-weight: 700; }
.blocks { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.chip {
  background: var(--free-soft); color: var(--free-ink); border-radius: 999px; padding: 3px 10px;
  font-size: .82rem; font-variant-numeric: tabular-nums;
}
.chip .et { color: var(--accent); margin-left: 6px; }
.none { color: var(--muted); font-size: .85rem; }
.empty { color: var(--muted); }
.note { color: var(--muted); font-size: .82rem; line-height: 1.5; }
@media (max-width: 520px) { h1 { font-size: 1.5rem; } .summary li { grid-template-columns: 1fr; gap: 4px; } }
.hcell .rec { margin-top: 4px; font-size: .7rem; font-weight: 700; padding: 2px 6px; border-radius: 999px; }
.hcell .rec.done { background: var(--free-soft); color: var(--free-ink); display: inline-block; }
.hcell button.rec { border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.hcell button.rec.done { border-color: var(--free); }
.slot.locked { cursor: not-allowed; background-image: repeating-linear-gradient(135deg, transparent 0 6px, var(--line-soft) 6px 7px); }
.slot.locked:hover { background-color: transparent; }
.slot.on.locked { background-color: var(--free); opacity: .8; }
.admin { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: .82rem; }
.admin button { font-size: .82rem; padding: 5px 10px; }
.banner { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--warn); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Horas libres</h1>
      <p class="sub" id="sub">Toca o arrastra sobre la cuadrícula para marcar tus horas libres; se guardan solas. Las horas están en Venezuela (UTC−4) y al lado se ve su equivalente en Nueva York. Los días marcados como “Recibido” ya no se pueden cambiar.</p>
    </div>
    <div class="weeknav">
      <button id="prev" type="button" aria-label="Semana anterior">←</button>
      <span class="label" id="weekLabel">Semana</span>
      <button id="next" type="button" aria-label="Semana siguiente">→</button>
      <button id="thisWeek" type="button">Esta semana</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="toolbar">
    <div class="left">
      <button id="copyPrev" type="button">Copiar semana anterior</button>
      <button id="clearWeek" type="button">Borrar semana</button>
      <button id="confirmClear" type="button" hidden>Sí, borrar lo no recibido</button>
      <button id="receiveWeek" type="button" class="primary" hidden>Recibir toda la semana</button>
    </div>
    <div class="legend"><span><span class="sw"></span>Libre</span><span class="status" id="status">Cargando…</span></div>
  </div>

  <div class="gridbox"><div class="grid" id="grid"></div></div>

  <section class="summary">
    <h2>Resumen de la semana</h2>
    <ul id="summary"></ul>
  </section>

  <p class="note" id="tzNote"></p>
  <div class="admin" id="admin"><span id="adminText"></span><button id="signIn" type="button">Entrar como Everth</button><button id="signOut" type="button" hidden>Salir</button></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ---------- Configuración ----------
// Pega aquí el objeto firebaseConfig de tu proyecto (Configuración del proyecto → Tus apps → Web).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCYay1fgH9U1c9iAVsG07uw5xyvaK8raTA",
  authDomain: "horas-libres-cafbc.firebaseapp.com",
  projectId: "horas-libres-cafbc",
  storageBucket: "horas-libres-cafbc.firebasestorage.app",
  messagingSenderId: "644067299460",
  appId: "1:644067299460:web:524bb7158665cec4b832d1"
};
// Cuenta de Google que puede marcar días como "Recibido" (debe coincidir con las reglas de Firestore).
const ADMIN_EMAIL = "everthjt4@gmail.com";

(() => {
  const START_H = 6, END_H = 24;            // horas mostradas (hora de Caracas)
  const STEP = 60;                          // minutos por casilla
  const VE_OFFSET = -4;                     // Venezuela: UTC-4 fijo, sin horario de verano
  const NY = "America/New_York";
  const DAYS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const DAYS_SHORT = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  const MONTHS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const times = [];
  for (let m = START_H * 60; m < END_H * 60; m += STEP) times.push(pad(Math.floor(m / 60)) + ":" + pad(m % 60));

  // Fechas como "YYYY-MM-DD" en hora de Caracas
  const iso = d => d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const todayVE = () => iso(new Date(Date.now() + VE_OFFSET * 3600e3));
  const mondayOf = s => { const d = parse(s); const wd = (d.getUTCDay() + 6) % 7; return addDays(s, -wd); };
  const weekDays = () => [0, 1, 2, 3, 4, 5, 6].map(i => addDays(week, i));

  // Instante UTC de una hora de Caracas
  const instant = (date, hhmm) => { const d = parse(date); const [h, m] = hhmm.split(":").map(Number); return new Date(d.getTime() + ((h - VE_OFFSET) * 60 + m) * 60e3); };
  const nyFmt = new Intl.DateTimeFormat("en-US", { timeZone: NY, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const nyZoneFmt = new Intl.DateTimeFormat("en-US", { timeZone: NY, timeZoneName: "short" });
  const nyTime = (date, hhmm) => { const p = Object.fromEntries(nyFmt.formatToParts(instant(date, hhmm)).map(x => [x.type, x.value])); return p.hour + ":" + p.minute; };
  const nyZone = date => (nyZoneFmt.formatToParts(instant(date, "12:00")).find(p => p.type === "timeZoneName") || {}).value || "ET";
  const addMin = (hhmm, n) => { const [h, m] = hhmm.split(":").map(Number); const t = h * 60 + m + n; return pad(Math.floor(t / 60)) + ":" + pad(t % 60); };

  let week = mondayOf(todayVE());
  let slots = {};             // { "YYYY-MM-DD": ["09:00", ...] }
  let locked = {};            // { "YYYY-MM-DD": true }
  let db = null, unsub = null, isAdmin = false, online = false;
  const dirty = new Set();
  let saveTimer = null;

  const setStatus = (t, warn) => { const el = $("status"); el.textContent = t; el.classList.toggle("warn", !!warn); };
  const has = (date, t) => (slots[date] || []).includes(t);
  const editable = date => online && (isAdmin || !locked[date]);
  const setSlot = (date, t, on) => {
    if (!editable(date)) return false;
    const list = new Set(slots[date] || []);
    on ? list.add(t) : list.delete(t);
    slots[date] = [...list].sort();
    dirty.add(date);
    return true;
  };

  // ---------- Render ----------
  function renderGrid() {
    const g = $("grid"); g.innerHTML = "";
    const head = (html, cls) => { const c = document.createElement("div"); c.className = "hcell " + (cls || ""); c.innerHTML = html; g.appendChild(c); return c; };
    head('<div class="tz">Vzla<br>UTC−4</div>');
    head('<div class="tz" style="color:var(--accent)">NY<br>' + nyZone(addDays(week, 3)) + "</div>");
    const today = todayVE();
    weekDays().forEach((d, i) => {
      const pd = parse(d);
      const c = head('<div class="d">' + DAYS_SHORT[i] + '</div><div class="n">' + pd.getUTCDate() + " " + MONTHS[pd.getUTCMonth()] + "</div>", d === today ? "today" : "");
      c.dataset.head = d;
    });
    times.forEach(t => {
      const a = document.createElement("div"); a.className = "time"; a.textContent = t; g.appendChild(a);
      const b = document.createElement("div"); b.className = "time et"; b.textContent = nyTime(addDays(week, 3), t); g.appendChild(b);
      weekDays().forEach((d, i) => {
        const c = document.createElement("div");
        c.className = "slot";
        c.dataset.date = d; c.dataset.time = t;
        c.setAttribute("role", "button");
        c.setAttribute("aria-label", DAYS[i] + " " + t);
        g.appendChild(c);
      });
    });
    paint();
  }

  function paint() {
    document.querySelectorAll(".slot").forEach(c => {
      const d = c.dataset.date, on = has(d, c.dataset.time);
      c.classList.toggle("on", on);
      c.classList.toggle("end", on && !has(d, addMin(c.dataset.time, STEP)));
      c.classList.toggle("locked", !!locked[d]);
      c.classList.toggle("ro", !editable(d));
      c.tabIndex = editable(d) ? 0 : -1;
      c.setAttribute("aria-pressed", on);
    });
    document.querySelectorAll("[data-head]").forEach(h => {
      const d = h.dataset.head;
      const old = h.querySelector(".rec"); if (old) old.remove();
      let el = null;
      if (isAdmin && online) {
        el = document.createElement("button"); el.type = "button";
        el.className = "rec" + (locked[d] ? " done" : "");
        el.textContent = locked[d] ? "Recibido ✓" : "Recibir";
        el.title = locked[d] ? "Toca para desbloquear" : "Bloquear este día";
        el.onclick = () => setLock([d], !locked[d]);
      } else if (locked[d]) {
        el = document.createElement("span"); el.className = "rec done"; el.textContent = "Recibido";
      }
      if (el) h.appendChild(el);
    });
    const allLocked = weekDays().every(d => locked[d]);
    $("receiveWeek").hidden = !(isAdmin && online);
    $("receiveWeek").textContent = allLocked ? "Desbloquear la semana" : "Recibir toda la semana";
    $("copyPrev").hidden = $("clearWeek").hidden = !online || (!isAdmin && allLocked);
    renderSummary();
  }

  function blocksOf(date) {
    const out = [];
    for (const t of (slots[date] || []).slice().sort()) {
      const last = out[out.length - 1];
      if (last && last.end === t) last.end = addMin(t, STEP);
      else out.push({ start: t, end: addMin(t, STEP) });
    }
    return out;
  }

  function renderSummary() {
    const ul = $("summary"); ul.innerHTML = "";
    weekDays().forEach((d, i) => {
      const bl = blocksOf(d);
      const li = document.createElement("li");
      const day = document.createElement("span"); day.className = "day"; day.textContent = DAYS[i];
      const box = document.createElement("span"); box.className = "blocks";
      if (!bl.length) { const n = document.createElement("span"); n.className = "none"; n.textContent = "Sin horas libres"; box.appendChild(n); }
      bl.forEach(b => {
        const endLabel = b.end === "24:00" ? "00:00" : b.end;
        const nyEnd = b.end === "24:00" ? nyTime(addDays(d, 1), "00:00") : nyTime(d, b.end);
        const ch = document.createElement("span"); ch.className = "chip";
        ch.textContent = b.start + "–" + endLabel + " Vzla";
        const et = document.createElement("span"); et.className = "et"; et.textContent = nyTime(d, b.start) + "–" + nyEnd + " " + nyZone(d);
        ch.appendChild(et); box.appendChild(ch);
      });
      if (locked[d]) { const r = document.createElement("span"); r.className = "none"; r.textContent = "· Recibido"; box.appendChild(r); }
      li.append(day, box); ul.appendChild(li);
    });
  }

  function renderWeekLabel() {
    const a = parse(week), b = parse(addDays(week, 6));
    $("weekLabel").textContent = a.getUTCDate() + " " + MONTHS[a.getUTCMonth()] + " – " + b.getUTCDate() + " " + MONTHS[b.getUTCMonth()];
    const zA = nyZone(week), zB = nyZone(addDays(week, 6));
    $("tzNote").textContent = zA === zB
      ? "Esta semana Nueva York está en " + zA + (zA === "EDT" ? ", la misma hora que Venezuela." : ", una hora menos que Venezuela.")
      : "Esta semana Nueva York cambia de " + zA + " a " + zB + "; el resumen muestra la hora correcta de cada día.";
  }

  // ---------- Marcar con mouse o dedo ----------
  let dragMode = null;
  const grid = $("grid");
  const lockedTap = d => { if (online && locked[d] && !isAdmin) setStatus("Ese día ya fue recibido y no se puede cambiar", true); };
  grid.addEventListener("pointerdown", e => {
    const c = e.target.closest(".slot");
    if (!c || e.pointerType !== "mouse") return;
    if (!editable(c.dataset.date)) { lockedTap(c.dataset.date); return; }
    e.preventDefault();
    dragMode = !has(c.dataset.date, c.dataset.time);
    setSlot(c.dataset.date, c.dataset.time, dragMode); paint();
  });
  grid.addEventListener("pointerover", e => {
    if (dragMode === null) return;
    const c = e.target.closest(".slot");
    if (c && setSlot(c.dataset.date, c.dataset.time, dragMode)) paint();
  });
  window.addEventListener("pointerup", () => { if (dragMode !== null) { dragMode = null; queueSave(); } });
  const toggle = c => {
    if (!editable(c.dataset.date)) { lockedTap(c.dataset.date); return; }
    setSlot(c.dataset.date, c.dataset.time, !has(c.dataset.date, c.dataset.time)); paint(); queueSave();
  };
  grid.addEventListener("click", e => {
    const c = e.target.closest(".slot");
    if (c && e.pointerType !== "mouse") toggle(c);   // el mouse ya pintó en pointerdown
  });
  grid.addEventListener("keydown", e => {
    const c = e.target.closest(".slot");
    if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(c); }
  });

  // ---------- Guardado en Firebase ----------
  const dayRef = d => db.collection("days").doc(d);
  function queueSave() {
    if (!dirty.size) return;
    setStatus("Guardando…");
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 500);
  }
  async function save() {
    const days = [...dirty]; dirty.clear();
    try {
      await Promise.all(days.map(d => dayRef(d).set({ slots: slots[d] || [], updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })));
      if (!dirty.size) setStatus("Guardado");
    } catch (err) {
      setStatus(err && err.code === "permission-denied" ? "Ese día ya fue recibido y no se puede cambiar" : "No se pudo guardar. Revisa tu conexión.", true);
    }
  }
  async function setLock(days, on) {
    try {
      await Promise.all(days.map(d => dayRef(d).set({ slots: slots[d] || [], locked: on, lockedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })));
      setStatus(on ? "Marcado como recibido" : "Desbloqueado");
    } catch (err) { setStatus("No se pudo cambiar el estado: " + (err.code || err.message), true); }
  }
  function subscribe() {
    if (unsub) unsub();
    if (!db) return;
    const id = firebase.firestore.FieldPath.documentId();
    const w = week;
    unsub = db.collection("days").where(id, ">=", w).where(id, "<=", addDays(w, 6)).onSnapshot(snap => {
      if (w !== week) return;
      const nextSlots = {}, nextLocked = {};
      snap.forEach(doc => { const v = doc.data(); nextSlots[doc.id] = v.slots || []; if (v.locked) nextLocked[doc.id] = true; });
      for (const d of dirty) nextSlots[d] = slots[d];       // no pisar lo que aún se está guardando
      if (dragMode !== null) return;
      slots = nextSlots; locked = nextLocked;
      paint();
      if (!dirty.size && $("status").textContent === "Cargando…") setStatus("Al día");
    }, err => setStatus("No se pudo leer: " + (err.code || err.message), true));
  }

  async function goWeek(w) {
    if (dirty.size) { clearTimeout(saveTimer); await save(); }
    week = w; slots = {}; locked = {};
    renderWeekLabel(); renderGrid(); setStatus("Cargando…");
    subscribe();
  }

  $("prev").onclick = () => goWeek(addDays(week, -7));
  $("next").onclick = () => goWeek(addDays(week, 7));
  $("thisWeek").onclick = () => goWeek(mondayOf(todayVE()));
  $("copyPrev").onclick = async () => {
    const id = firebase.firestore.FieldPath.documentId(), pw = addDays(week, -7);
    const snap = await db.collection("days").where(id, ">=", pw).where(id, "<=", addDays(pw, 6)).get().catch(() => null);
    if (!snap || snap.empty) { setStatus("La semana anterior no tiene horas marcadas", true); return; }
    let changed = 0;
    snap.forEach(doc => {
      const d = addDays(doc.id, 7);
      if (editable(d) && (doc.data().slots || []).length) { slots[d] = doc.data().slots.slice(); dirty.add(d); changed++; }
    });
    paint();
    changed ? queueSave() : setStatus("No hay nada que copiar a los días abiertos", true);
  };
  $("clearWeek").onclick = () => { $("confirmClear").hidden = false; setTimeout(() => $("confirmClear").hidden = true, 5000); };
  $("confirmClear").onclick = () => {
    $("confirmClear").hidden = true;
    weekDays().forEach(d => { if (editable(d) && (slots[d] || []).length) { slots[d] = []; dirty.add(d); } });
    paint(); queueSave();
  };
  $("receiveWeek").onclick = () => { const all = weekDays().every(d => locked[d]); setLock(weekDays(), !all); };

  // ---------- Arranque ----------
  renderWeekLabel(); renderGrid();
  if (!FIREBASE_CONFIG || !window.firebase) {
    $("banner").hidden = false;
    $("banner").textContent = "Falta conectar la base de datos de Firebase. Mientras tanto la página no guarda nada.";
    setStatus("Sin conexión", true); $("admin").hidden = true;
    return;
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  online = true;
  paint();
  subscribe();
  const auth = firebase.auth();
  $("signIn").onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => setStatus("No se pudo entrar: " + (e.code || e.message), true));
  $("signOut").onclick = () => auth.signOut();
  auth.onAuthStateChanged(u => {
    isAdmin = !!(u && ADMIN_EMAIL && u.email && u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase());
    $("signIn").hidden = !!u; $("signOut").hidden = !u;
    $("adminText").textContent = u ? (isAdmin ? "Entraste como " + u.email + ". Puedes marcar días como recibidos." : u.email + " no puede marcar días como recibidos.") : "";
    paint();
  });
})();
</script>
</body>
</html>
